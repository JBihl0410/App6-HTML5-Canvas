   <head> 
       <title>Canvas App - J. Bihl</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="w3.css">

    <style>
        body {
            text-align: center;
        }

        /* Canvas box */
        #myCanvas {
            border: 2px solid black;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <!-- Title -->
    <div class="w3-container w3-blue">
        <h2>My Canvas App</h2>
    </div>

    <p>Click the buttons to draw!</p>

    <!-- Canvas -->
    <canvas id="myCanvas" width="300" height="300"></canvas>

    <br><br>

    <!-- Buttons -->
    <button onclick="drawRectangle()">Rectangle</button>
    <button onclick="drawName()">Name</button>
    <button onclick="drawImage()">Image</button>
    <button onclick="clearCanvas()">Clear</button>

    <script>
        // get canvas
        var canvas = document.getElementById("myCanvas");
        var ctx = canvas.getContext("2d");

        // draw rectangle
        function drawRectangle() {
            ctx.fillStyle = "Dark Green";
            ctx.fillRect(50, 50, 150, 100);
        }

        // write name
        function drawName() {
            ctx.font = "20px Arial";
            ctx.fillStyle = "black";
            ctx.fillText("Jayden I. Bihl", 80, 200);
        }

        // draw image
        function drawImage() {
            var img = new Image();
            img.src = "myimageSB.jpg";

            img.onload = function () {
                ctx.drawImage(img, 75, 75, 150, 150);
            };
        }

        // clear canvas
        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    </script>

</body>
</html>
